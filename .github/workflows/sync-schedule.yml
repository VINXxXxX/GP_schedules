# Keeps schedule/motogp_<year>.json in line with MotoGP's official timetable.
# The phone and TV apps read these files (ScheduleSync.kt), so a changed session time
# reaches both without editing anything by hand.
name: Sync MotoGP schedule

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (minute 17 avoids the busy top of the hour)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write             # lets the job commit the updated JSON with the built-in token

concurrency:
  group: schedule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official times and update the JSON
        run: python tools/sync_schedule.py schedule

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- schedule; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add schedule
          git commit -m "Schedule: official session times $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
